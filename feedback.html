<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rate Our Service | Prixna IT Solution</title>
<meta name="description" content="How was Prixna IT Solution's service? Rate 1-5 stars. Happy customers help with a Google review.">
<link rel="canonical" href="https://prixnaitsolution.com.np/feedback.html">
<meta name="theme-color" content="#0A1A38">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>try{if(localStorage.getItem("prixna_theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
<style>
.stars{display:flex;gap:8px;font-size:38px;margin:12px 0;cursor:pointer}
.stars button{background:none;border:0;font-size:38px;cursor:pointer;filter:grayscale(1);transition:.15s;padding:2px}
.stars button.on,.stars button:hover{filter:none;transform:scale(1.15)}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header id="site-header"></header>
<main id="main">
<section class="page-hero"><div class="container">
<p class="crumb"><a href="index.html">Home</a> / Feedback</p>
<h1>How was our service? 🙏</h1>
<p>Tap stars below — takes 10 seconds. Reference auto-filled from your booking link.</p>
</div></section>
<section class="section"><div class="container" style="max-width:640px">
<div class="form-card">
<h3 style="margin-top:0">Rate your visit <span class="small muted" id="fb-ref"></span></h3>
<div class="stars" id="fb-stars" role="radiogroup" aria-label="Star rating">
<button data-v="1" aria-label="1 star">⭐</button><button data-v="2" aria-label="2 stars">⭐</button><button data-v="3" aria-label="3 stars">⭐</button><button data-v="4" aria-label="4 stars">⭐</button><button data-v="5" aria-label="5 stars">⭐</button>
</div>
<div class="f-item"><label class="flab" for="fb-name">Name (optional)</label><input class="inp" id="fb-name" placeholder="Your name"></div>
<div class="f-item"><label class="flab" for="fb-comment">Comment (optional)</label><textarea class="inp" id="fb-comment" placeholder="Ke bhannu chha? / Anything to add?"></textarea></div>
<button class="btn btn-primary btn-block" id="fb-send">Send rating →</button>
<div id="fb-out" style="margin-top:14px"></div>
</div>
</div></section>
</main>
<footer id="site-footer"></footer>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/prixna-notify.js"></script>
<script>
(function(){
var rating=0, ref="";
try{ ref=new URLSearchParams(location.search).get("ref")||""; }catch(e){}
if(ref) document.getElementById("fb-ref").textContent="· Ref "+ref;
var btns=document.querySelectorAll("#fb-stars button");
btns.forEach(function(b){ b.onclick=function(){ rating=+b.dataset.v;
btns.forEach(function(x){ x.classList.toggle("on", +x.dataset.v<=rating); }); }; });
document.getElementById("fb-send").onclick=function(){
if(!rating){ document.getElementById("fb-out").innerHTML='<div class="form-err show">⚠️ Please tap stars first (1–5).</div>'; return; }
var payload={ ref:ref, rating:rating, name:document.getElementById("fb-name").value, comment:document.getElementById("fb-comment").value };
var out=document.getElementById("fb-out");
out.innerHTML="Sending…";
function fallbackok(j){
var rUrl="https://search.google.com/local/writereview?placeid=ChIJLeSgRjcZ6zkR0UwBUHfxTFE";
if(j && j.reviewUrl) rUrl=j.reviewUrl;
if(j.mood==="happy"){
out.innerHTML='<div class="form-ok show"><b>'+j.thank+'</b><br>Google review le hamro sano team lai thulo sahayog garchha! 🙏<div class="btn-row" style="margin-top:12px"><a class="btn btn-primary btn-sm" target="_blank" rel="noopener" href="'+rUrl+'">⭐ Leave Google review</a></div></div>';
}else{
out.innerHTML='<div class="form-ok show"><b>'+j.thank+'</b><br>Reference: <b>'+j.id+'</b>. Ticket created for our supervisor.</div>';
}
try{ var k="prixna_feedback_v1"; var a=JSON.parse(localStorage.getItem(k)||"[]"); a.unshift(Object.assign({ts:new Date().toISOString()},payload,j)); localStorage.setItem(k,JSON.stringify(a.slice(0,50))); }catch(e){}
try{ if(window.PRIXNA_NOTIFY) window.PRIXNA_NOTIFY.push("feedback", Object.assign({id:(j&&j.id)||""}, payload)); }catch(e){}
}
fetch("/api/feedback",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)})
.then(function(r){return r.json();}).then(fallbackok)
.catch(function(){
// offline fallback: queue + WhatsApp
try{ var k="prixna_feedback_v1"; var a=JSON.parse(localStorage.getItem(k)||"[]"); a.unshift(Object.assign({ts:new Date().toISOString(),offline:true},payload)); localStorage.setItem(k,JSON.stringify(a.slice(0,50))); }catch(e){}
try{ if(window.PRIXNA_NOTIFY) window.PRIXNA_NOTIFY.push("feedback", payload); }catch(e2){}
var wa="https://wa.me/9779813714582?text="+encodeURIComponent("Namaste Prixna! Feedback "+rating+"/5 for "+(ref||"visit")+". "+payload.comment);
out.innerHTML='<div class="form-ok show"><b>Saved on this device ✅</b> (offline). Please also tap to send via WhatsApp:<div class="btn-row" style="margin-top:12px"><a class="btn btn-whatsapp btn-sm" target="_blank" rel="noopener" href="'+wa+'">💬 Send on WhatsApp</a></div></div>';
});
};
})();
</script>
</body>
</html>
